<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="cashGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Back Bill -->
  <rect x="8" y="14" width="38" height="22" rx="2.5" fill="#047857" transform="rotate(-10 27 25)" stroke="#6EE7B7" stroke-width="0.8" />
  <!-- Front Bill -->
  <rect x="18" y="24" width="38" height="22" rx="2.5" fill="url(#cashGreen)" transform="rotate(8 37 35)" stroke="#A7F3D0" stroke-width="0.8" />
  <!-- Front Coin -->
  <circle cx="32" cy="38" r="14" fill="url(#goldCoinGrad)" stroke="#FFFBEB" stroke-width="1.2" />
  <circle cx="32" cy="38" r="11" fill="none" stroke="#B45309" stroke-width="0.8" stroke-dasharray="2 1.5" />
  <text x="32" y="42" font-size="12" font-weight="900" fill="#78350F" text-anchor="middle" font-family="sans-serif">₨</text>
</svg>
