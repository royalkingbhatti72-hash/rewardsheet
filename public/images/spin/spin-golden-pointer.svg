<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="48" height="56" fill="none">
  <defs>
    <!-- Gold 3D Facet Left (Highlight) -->
    <linearGradient id="goldFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="30%" stop-color="#FFE885" />
      <stop offset="70%" stop-color="#FFD45A" />
      <stop offset="100%" stop-color="#D49A10" />
    </linearGradient>

    <!-- Gold 3D Facet Right (Shadow) -->
    <linearGradient id="goldFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D49A10" />
      <stop offset="40%" stop-color="#A46E06" />
      <stop offset="80%" stop-color="#7A5002" />
      <stop offset="100%" stop-color="#4A2F00" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFE885" />
      <stop offset="55%" stop-color="#FFD45A" />
      <stop offset="80%" stop-color="#A46E06" />
      <stop offset="100%" stop-color="#FFF0A0" />
    </linearGradient>

    <!-- Ruby Jewel Center -->
    <radialGradient id="rubyJewel" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF9E9E" />
      <stop offset="22%" stop-color="#FF3333" />
      <stop offset="65%" stop-color="#B80000" />
      <stop offset="100%" stop-color="#4D0000" />
    </radialGradient>

    <!-- Specular Diamond Shine -->
    <linearGradient id="gemShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Pointer Glow Filter -->
    <filter id="pointerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD45A" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#pointerGlow)">
    <!-- Base Shape Outer Stroke for High Definition Contrast -->
    <path
      d="M 24 53 L 13.5 19 C 12.5 16.5 13 13 15 11 C 17.5 8.5 21 7.5 24 7.5 C 27 7.5 30.5 8.5 33 11 C 35 13 35.5 16.5 34.5 19 Z"
      fill="#2A1B00"
      stroke="#5A3900"
      stroke-width="1.2"
    />

    <!-- Left Chisel Facet (3D Light Reflection) -->
    <path
      d="M 24 52.5 L 14 18.5 C 13.2 16.5 13.8 14 15.5 12 L 24 12 Z"
      fill="url(#goldFacetLeft)"
    />

    <!-- Right Chisel Facet (3D Shadow Volume) -->
    <path
      d="M 24 52.5 L 24 12 L 32.5 12 C 34.2 14 34.8 16.5 34 18.5 Z"
      fill="url(#goldFacetRight)"
    />

    <!-- Center Ridge Chisel Highlight -->
    <line x1="24" y1="12" x2="24" y2="52" stroke="#FFFDF0" stroke-width="0.8" stroke-linecap="round" opacity="0.95" />

    <!-- Top Medallion Outer Gold Rim -->
    <circle cx="24" cy="14" r="11" fill="url(#goldRim)" stroke="#4A2F00" stroke-width="0.8" />
    <circle cx="24" cy="14" r="8.8" fill="#1A0D00" stroke="#FFD45A" stroke-width="0.6" />

    <!-- Royal Ruby Gemstone Inlay -->
    <circle cx="24" cy="14" r="7.2" fill="url(#rubyJewel)" />

    <!-- Gem Specular Highlight Oval -->
    <ellipse cx="21.8" cy="11.5" rx="3.2" ry="1.8" transform="rotate(-30 21.8 11.5)" fill="url(#gemShine)" />

    <!-- Precision Needle Tip Glint -->
    <polygon points="24,53 22.8,47 25.2,47" fill="#FFFFFF" />
    <circle cx="24" cy="47" r="0.8" fill="#FFF8D0" />
  </g>
</svg>
