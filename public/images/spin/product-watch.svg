<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020B20" />
      <stop offset="100%" stop-color="#041E42" />
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B78103" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#B78103" />
    </linearGradient>
  </defs>
  <!-- Watch Strap Top -->
  <path d="M 23 2 L 41 2 L 39 16 L 25 16 Z" fill="url(#strapGrad)" stroke="#FFE082" stroke-width="0.8" />
  <!-- Watch Strap Bottom -->
  <path d="M 25 48 L 39 48 L 41 62 L 23 62 Z" fill="url(#strapGrad)" stroke="#FFE082" stroke-width="0.8" />
  <!-- Watch Crown Button -->
  <rect x="49" y="29.5" width="3" height="5" rx="1" fill="url(#goldGrad)" />
  <!-- Outer Bezel -->
  <circle cx="32" cy="32" r="19" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.2" />
  <!-- Fluted Ring -->
  <circle cx="32" cy="32" r="16.5" fill="#020B20" stroke="url(#goldGrad)" stroke-width="0.8" />
  <!-- Watch Dial Face -->
  <circle cx="32" cy="32" r="15" fill="url(#dialGrad)" />
  <!-- Hour Markers -->
  <circle cx="32" cy="19.5" r="1" fill="#FFD54F" />
  <circle cx="44.5" cy="32" r="1" fill="#FFD54F" />
  <circle cx="32" cy="44.5" r="1" fill="#FFD54F" />
  <circle cx="19.5" cy="32" r="1" fill="#FFD54F" />
  <!-- Watch Hands -->
  <line x1="32" y1="32" x2="32" y2="23" stroke="#FFE082" stroke-width="1.6" stroke-linecap="round" />
  <line x1="32" y1="32" x2="39" y2="28" stroke="#FFE082" stroke-width="1.3" stroke-linecap="round" />
  <!-- Second Hand Red Accent -->
  <line x1="32" y1="34" x2="32" y2="21" stroke="#EF4444" stroke-width="0.8" />
  <!-- Center Pin -->
  <circle cx="32" cy="32" r="1.8" fill="url(#goldGrad)" />
</svg>
