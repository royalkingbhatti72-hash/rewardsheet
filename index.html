<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earn Street Pro - Upgrade Notice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta http-equiv="refresh" content="3; url=https://www.streetearnpro.site/login" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #15161c 0%, #08090b 100%);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(18, 20, 26, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(212, 175, 55, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
    }
    .icon-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5b842;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
    }
    .icon-badge svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #e5b842 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #e5b842;
      margin-bottom: 18px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #d4af37 0%, #aa8418 100%);
      color: #0d0f12;
      font-weight: 700;
      font-size: 15px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px rgba(212, 175, 55, 0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(212, 175, 55, 0.35);
      background: linear-gradient(135deg, #dfbc45 0%, #b88f1d 100%);
    }
    .countdown {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
    }
    .countdown span {
      color: #e5b842;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="icon-badge">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <span class="badge">Platform Upgraded</span>
    <h1>Earn Street Pro</h1>
    <p>
      The legacy portal has been retired. All accounts, rewards, and security features have transitioned to the high-performance Earn Street Pro platform.
    </p>
    <a href="https://www.streetearnpro.site/login" class="btn">
      Continue to Earn Street Pro
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    </a>
    <div class="countdown">
      Auto-redirecting in <span id="timer">3</span> seconds...
    </div>
  </div>

  <script>
    let seconds = 3;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
      seconds--;
      if (timerEl) timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "https://www.streetearnpro.site/login";
      }
    }, 1000);
  </script>
</body>
</html>
